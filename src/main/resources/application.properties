spring.application.name=accommodation-rental

spring.datasource.url=jdbc:postgresql://localhost:5433/accommodation_rental
spring.datasource.username=emt
spring.datasource.password=emt

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
app.materialized-view-refresh-rate-ms=60000

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8080